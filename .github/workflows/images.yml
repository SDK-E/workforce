name: Container verification

on:
  pull_request:
    paths:
      - docker/**
      - scripts/build-images.sh
      - scripts/verify-image-sizes.sh
      - scripts/verify-engines.sh
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - docker/**
      - scripts/build-images.sh
      - scripts/verify-image-sizes.sh
      - scripts/verify-engines.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned agent and egress images
        run: sh scripts/build-images.sh
      - name: Verify Docker isolation contract
        run: sh scripts/verify-sandbox.sh
